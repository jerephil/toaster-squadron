name: Windows build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MSVC x64 build and screensaver contract
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Visual Studio 2022 C++ toolchain
        shell: pwsh
        run: ./tools/ensure-msvc2022.ps1
      - name: Configure Visual Studio 2022
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Compile Release
        run: cmake --build build --config Release --parallel
      - name: Test screensaver contract on Windows
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Capture actual running saver (when desktop capture is available)
        continue-on-error: true
        shell: pwsh
        run: ./tools/capture_screenshot.ps1 -Saver build/Release/ToasterSquadron.scr -Output screenshot.png
      - name: Package standalone saver and source art
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Release/ToasterSquadron.scr dist/
          Copy-Item README.md,LICENSE dist/
          Copy-Item docs/ART-BRIEF.md dist/
          Copy-Item assets dist/assets -Recurse
          if (Test-Path screenshot.png) { Copy-Item screenshot.png dist/ }
          $hash = (Get-FileHash dist/ToasterSquadron.scr -Algorithm SHA256).Hash.ToLower()
          "$hash  ToasterSquadron.scr" | Set-Content dist/SHA256SUMS.txt
          Compress-Archive -Path dist/* -DestinationPath ToasterSquadron-windows-x64.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToasterSquadron-windows-x64
          path: |
            dist/
            ToasterSquadron-windows-x64.zip
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish approved version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ToasterSquadron-windows-x64
          path: release-artifact
      - name: Attach saver and zip to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG release-artifact/dist/ToasterSquadron.scr release-artifact/ToasterSquadron-windows-x64.zip release-artifact/dist/SHA256SUMS.txt --verify-tag --title "Toaster Squadron $env:RELEASE_TAG" --generate-notes
